# Workspace / dev-tooling aggregator only. The shared core (tckdb_core/) and each adapter
# (e.g. adapters/tckdb_arc/) is an independently-installable, independently-versioned package
# with its own pyproject.toml; this top-level file is not a distributable package. Install the
# core first, then an adapter: `pip install -e ./tckdb_core -e ./adapters/tckdb_arc[test]`.

# Lets `python -m pytest` run from the repo root. The outer tckdb_core/ and
# adapters/tckdb_arc/ distribution dirs (no __init__.py) would otherwise shadow the real
# packages as namespace packages when cwd is on sys.path; pythonpath is inserted
# ahead of cwd. Per-package runs (cd adapters/tckdb_arc && pytest) use that package's own ini.
# adapters/tckdb_chemkin and adapters/tckdb_qcschema are not listed: their tests/conftest.py and
# test_uploader.py share module names with tckdb_core's and tckdb_arc's, and one process fails at
# collection, so they run from their own directories.
[tool.pytest.ini_options]
pythonpath = ["tckdb_core", "adapters/tckdb_arc"]
testpaths = ["tckdb_core/tests", "adapters/tckdb_arc/tests"]
