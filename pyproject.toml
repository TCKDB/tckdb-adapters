# Workspace / dev-tooling aggregator only. The shared core (tckdb_core/) and each adapter
# (e.g. adapters/tckdb_arc/) are independently-installable, independently-versioned packages,
# each with its own pyproject.toml; this top-level file is not a distributable package. Install
# the core first, then an adapter: `pip install -e ./tckdb_core -e ./adapters/tckdb_arc[test]`.

# Lets `python -m pytest` run from the repo root. pythonpath is inserted ahead of cwd, so the
# outer tckdb_core/ distribution dir (no __init__.py) does not shadow the real package as a
# namespace package when the repo root is on sys.path. adapters/tckdb_arc is listed because the
# tckdb_arc package is imported from there; no adapter is importable from the repo root without
# it. Per-package runs (cd adapters/tckdb_arc && pytest) use that package's own ini.
# adapters/tckdb_chemkin and adapters/tckdb_qcschema are not listed: their tests/conftest.py and
# test_uploader.py share module names with tckdb_core's and tckdb_arc's, and one process fails at
# collection, so they run from their own directories.
[tool.pytest.ini_options]
pythonpath = ["tckdb_core", "adapters/tckdb_arc"]
testpaths = ["tckdb_core/tests", "adapters/tckdb_arc/tests"]
