name: docs

# Builds the documentation site (MkDocs, Material theme; see mkdocs.yml). A pull request
# only gets `mkdocs build --strict`; a push to main also publishes the site to GitHub Pages.

on:
  # No path filter on pull_request: the link hook checks that any repository file a page
  # links to exists, so no list of paths is complete. Every pull request gets the build.
  pull_request:
  push:
    branches: [main]
    # On main the filter only saves a redeploy: these are the files the site is built from
    # (AGENTS.md is the target of a link in CONTRIBUTING.md).
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/mkdocs_hooks.py"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "tckdb_core/README.md"
      - "tckdb_core/CHANGELOG.md"
      - "adapters/tckdb_arc/README.md"
      - "adapters/tckdb_arc/CHANGELOG.md"
      - "adapters/tckdb_chemkin/README.md"
      - "adapters/tckdb_chemkin/CHANGELOG.md"
      - "adapters/tckdb_qcschema/README.md"
      - "adapters/tckdb_qcschema/CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request builds replace the earlier run for the same ref; deployments queue.
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the documentation tools
        run: pip install -r requirements-docs.txt

      - name: Build the site (warnings fail the build)
        run: mkdocs build --strict

      - name: Upload the site
        # Only main is published; a manual run on another branch only builds.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
