name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets tckdb-drift.yml start CI on the PR it opens (a PR created with GITHUB_TOKEN
  # does not trigger pull_request workflows by itself).
  workflow_dispatch:

jobs:
  tckdb-arc:
    name: tckdb-arc (base, no-ARC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: adapters/tckdb_arc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read the TCKDB pin
        # tckdb-pin.toml (repo root) holds the tested TCKDB commit; it is kept out
        # of the workflow files so tools/tckdb_drift.py --bump never edits them.
        # The tool fails loudly if the file or its sha is malformed.
        run: python ../../tools/tckdb_drift.py --install-specs >> "$GITHUB_ENV"

      - name: Install the shared layer (tested source revision)
        run: |
          python -m pip install --upgrade pip
          pip install "$TCKDB_CLIENT_SPEC" "$TCKDB_SCHEMAS_SPEC"

      - name: Fetch TCKDB's backend modules (backend/app/chemistry and the deck parsers) at the pinned revision
        # tests/test_level_rules.py and test_energy_level_declaration.py compare the
        # adapter's replica of TCKDB's level-of-theory identity with the backend's own
        # pure modules, and test_deck_qualifiers.py compares the typed level qualifiers it
        # reads from a deck with TCKDB's ORCA and Gaussian deck parsers
        # (backend/app/services/*_parameter_parser.py, which need no web dependencies). Same repo and sha as the install above (read from the spec, so
        # a --bump moves both). TCKDB_REQUIRE_BACKEND=1 makes the comparison fail, not
        # skip, if this step is ever removed. Locally: export TCKDB_BACKEND_PATH to a
        # TCKDB checkout's backend/ (the comparison skips without it). The fetch is
        # tools/fetch_tckdb_backend.sh, which tckdb-drift.yml runs too; it prints the two
        # variables.
        run: bash ../../tools/fetch_tckdb_backend.sh "$TCKDB_SCHEMAS_SPEC" "$RUNNER_TEMP/tckdb" >> "$GITHUB_ENV"

      - name: Install tckdb-adapters-core (editable, before tckdb-arc)
        # tckdb-arc depends on tckdb-adapters-core (not on PyPI yet); the editable
        # install of ../../tckdb_core satisfies that requirement for the next step.
        run: pip install -e "../../tckdb_core[test]"

      - name: Install tckdb-arc (base + test extra)
        run: pip install -e ".[test]"

      - name: Run the base (no-ARC) test suite
        # ARC is NOT installed here, so the arc-coupled tests self-skip via
        # pytest.importorskip("arc"). The base suite must be fully green.
        run: pytest -q

      - name: Run the tckdb-adapters-core test suite
        # The producer-agnostic tests (level-identity replica, payload writer, API
        # key resolution, upload pipeline, the "no ARC in core" guard) live with the
        # package. TCKDB_BACKEND_PATH / TCKDB_REQUIRE_BACKEND from the step above
        # apply to its backend comparison too.
        working-directory: tckdb_core
        run: pytest -q

  # tckdb-chemkin and tckdb-qcschema are file-format adapters: they build on
  # tckdb-client (and tckdb-schemas) directly, not on tckdb-adapters-core. Each
  # suite runs from its own directory: their tests/conftest.py and test_uploader.py
  # share module names with tckdb_core's and tckdb_arc's, so a root run fails at
  # collection.
  tckdb-chemkin:
    name: tckdb-chemkin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: adapters/tckdb_chemkin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read the TCKDB pin
        run: python ../../tools/tckdb_drift.py --install-specs >> "$GITHUB_ENV"

      - name: Install the TCKDB packages (tested source revision)
        run: |
          python -m pip install --upgrade pip
          pip install "$TCKDB_CLIENT_SPEC" "$TCKDB_SCHEMAS_SPEC"

      - name: Install tckdb-chemkin (test extra; brings the RDKit wheel)
        run: pip install -e ".[test]"

      - name: Run the tckdb-chemkin test suite
        # The six Cantera comparison tests skip without cantera, as they do in
        # TCKDB's CI.
        run: pytest -q

  tckdb-qcschema:
    name: tckdb-qcschema
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: adapters/tckdb_qcschema
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read the TCKDB pin
        run: python ../../tools/tckdb_drift.py --install-specs >> "$GITHUB_ENV"

      - name: Install the TCKDB packages (tested source revision)
        run: |
          python -m pip install --upgrade pip
          pip install "$TCKDB_CLIENT_SPEC" "$TCKDB_SCHEMAS_SPEC"

      - name: Install tckdb-qcschema (test extra; qcelemental pinned exactly)
        run: pip install -e ".[test]"

      - name: Run the tckdb-qcschema test suite
        run: pytest -q

  package-metadata:
    # Metadata rot fails a pull request, not the release: every distribution
    # tools/python_release.py publishes is built and checked here.
    name: Package build and metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install "build>=1.2" "twine>=6.1" pytest PyYAML

      - name: Build every distribution
        run: |
          for dir in tckdb_core adapters/tckdb_arc adapters/tckdb_chemkin adapters/tckdb_qcschema; do
            python -m build --outdir "dist/$(basename "$dir")" "$dir"
          done

      - name: Check the distribution metadata
        run: python -m twine check --strict dist/*/*

      - name: Test the publish workflow, release tool and non-ASCII check
        run: python -m pytest -q -p no:cacheprovider tools/tests

      - name: Non-ASCII in runtime strings
        # Raised, logged and accumulated-warning strings in the four packages stay ASCII;
        # --audit fails on a source file that is neither scanned nor declared out of scope.
        run: |
          python tools/check_runtime_ascii.py
          python tools/check_runtime_ascii.py --audit

  # ── ARC-coupled leg (documented, NOT run in CI) ──────────────────────────
  # ARC is a conda/PYTHONPATH install, not a PyPI package, so CI cannot
  # `pip install arc`. To exercise the arc-gated tests (freq-Hessian / IRC /
  # GSM reparse), run the suite in an environment that already has ARC on the
  # PYTHONPATH (for example ARC's `arc_env`):
  #
  #     conda run -n arc_env pip install -e "adapters/tckdb_arc[test]"
  #     conda run -n arc_env pytest adapters/tckdb_arc/tests -q
  #
  # There the 12 `importorskip("arc")` tests execute instead of skipping.
