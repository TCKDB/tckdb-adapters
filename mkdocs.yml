# Documentation site. Build and check with: mkdocs build --strict
# Moving the repository means editing site_url and repo_url here and the URLs in README.md
# (the badges and the docs link). The branch name that links to source files point at lives
# in tools/mkdocs_hooks.py.
site_name: tckdb-adapters
site_description: Producer adapters that turn a tool's output into TCKDB upload payloads.
site_url: https://calvinp0.github.io/tckdb-adapters/
repo_url: https://github.com/calvinp0/tckdb-adapters
edit_uri: ""
docs_dir: docs

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Pages for files that live outside docs/ (the READMEs, the changelogs, CONTRIBUTING.md)
  # are short stubs under docs/ that include the real file at build time. Relative links
  # inside an included file are rewritten to resolve from the stub.
  - include-markdown

hooks:
  # Turns links that are right on GitHub but point outside docs/ into links that are right
  # on the site.
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  # Make `mkdocs build --strict` fail on everything that is wrong, not only on a missing link
  # target: a page left out of nav, an absolute link, a link the build cannot resolve, a
  # missing anchor.
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Adapters:
      - adapters/index.md
      - ARC:
          - adapters/arc/index.md
          - Mapping: contract/ARC_MAPPING.md
          - Changelog: adapters/arc/changelog.md
  - Core:
      - core/index.md
      - Changelog: core/changelog.md
  - Reference:
      - Warning codes: contract/WARNING_CODES.md
  - Developing:
      - Writing an adapter: writing_an_adapter.md
      - The TCKDB pin: tckdb_pin.md
      - Integration gate: contract/INTEGRATION_GATE.md
      - Contributing: contributing.md
