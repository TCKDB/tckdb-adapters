# Documentation site. Build and check with: mkdocs build --strict
# This file is the one place that names the site address and the repository, so moving
# the repository means editing site_url and repo_url here and nothing else.
site_name: tckdb-adapters
site_description: Producer adapters that turn a tool's output into TCKDB upload payloads.
site_url: https://calvinp0.github.io/tckdb-adapters/
repo_url: https://github.com/calvinp0/tckdb-adapters
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Pages for files that live outside docs/ (the READMEs, the changelogs, CONTRIBUTING.md)
  # are short stubs under docs/ that include the real file at build time. Relative links
  # inside an included file are rewritten to resolve from the stub.
  - include-markdown

hooks:
  # Turns links that are right on GitHub but point outside docs/ into links that are right
  # on the site.
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Using the ARC adapter: arc.md
  - Reference:
      - ARC mapping: contract/ARC_MAPPING.md
      - Warning codes: contract/WARNING_CODES.md
  - The core: core.md
  - Writing an adapter: writing_an_adapter.md
  - Maintenance:
      - The TCKDB pin: tckdb_pin.md
      - Integration gate: contract/INTEGRATION_GATE.md
  - Changelogs:
      - tckdb-adapters-core: changelog_core.md
      - tckdb-arc: changelog_arc.md
  - Contributing: contributing.md
