[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-arc"
version = "0.15.15"
description = "ARC adapter for TCKDB: builds species, reaction and transition-state upload payloads from an ARC run and uploads them."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The tckdb-adapters contributors" }]
keywords = ["TCKDB", "thermochemistry", "kinetics", "computational chemistry", "ARC"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "tckdb-adapters-core>=0.5.15,<0.6",  # producer-agnostic upload pipeline, numerics, rules, test kit
    "tckdb-client>=0.208,<0.209",   # tested transport + replay contract
    "tckdb-schemas>=0.175,<0.176", # the producer contract module ships from 0.52
    "PyYAML>=6",                  # vendored read_yaml_file
]

[project.urls]
Homepage = "https://github.com/TCKDB/tckdb-adapters"
Repository = "https://github.com/TCKDB/tckdb-adapters"
Issues = "https://github.com/TCKDB/tckdb-adapters/issues"
Changelog = "https://github.com/TCKDB/tckdb-adapters/blob/main/tckdb_arc/CHANGELOG.md"

[project.optional-dependencies]
# NOTE: ARC is NOT pip-installable as `arc` from PyPI — it is a conda/PYTHONPATH
# install. This extra is a *documented marker* only; it does NOT resolve ARC via
# pip. The three parser-coupled paths (Hessian / IRC / GSM) degrade gracefully
# through tckdb_arc._arc_optional when ARC is not importable. Run the arc-gated
# tests only where ARC is already on the path.
arc = []
test = ["pytest", "jsonschema>=4.18"]  # jsonschema: contract JSON Schema checks

[project.scripts]
tckdb-arc-upload = "tckdb_arc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tckdb_arc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../tckdb_core"]  # sibling core + this package ahead of cwd/editable installs from another checkout
