[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-adapters-core"
version = "0.5.19"
description = "Shared core of the TCKDB upload adapters: payload writer, upload pipeline, idempotency keys, level identity, numerics, rule pre-checks and a contract test kit."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The tckdb-adapters contributors" }]
keywords = ["TCKDB", "thermochemistry", "kinetics", "computational chemistry", "upload"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "tckdb-client>=0.210,<0.211",   # tested transport + replay contract
    "tckdb-schemas>=0.177,<0.178", # the producer contract module ships from 0.52
    "pydantic>=2.6",              # the published request models the pre-POST check runs (tckdb-schemas requires the same)
    "jsonschema>=4.18",           # standalone submit validates against the shipped schemas
    "PyYAML>=6",                  # element data loader (tckdb_core.xyz)
    "numpy>=1.23",               # xyz_from_data / xyz_to_str
]

[project.urls]
Homepage = "https://github.com/TCKDB/tckdb-adapters"
Repository = "https://github.com/TCKDB/tckdb-adapters"
Issues = "https://github.com/TCKDB/tckdb-adapters/issues"
Changelog = "https://github.com/TCKDB/tckdb-adapters/blob/main/tckdb_core/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tckdb_core*"]

[tool.setuptools.package-data]
tckdb_core = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # package dir ahead of a repo-root cwd, so the outer dir is not a namespace package
